<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Cook</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="top-nav">
    <div class="top-nav-inner">
        <div class="top-nav-brand">Run Coach</div>
        <div class="top-nav-links">
            <a href="index.html" class="top-nav-link">Dashboard</a>
            <a href="plan.html" class="top-nav-link">Training plan</a>
            <a href="cook.html" class="top-nav-link active">The Cook</a>
        </div>
        <div class="header-actions">
            <button id="update-btn" class="update-btn">Update</button>
            <div id="update-status" class="update-status"></div>
        </div>
    </div>
</nav>

<div class="wrap">
    <div class="banner">
        <div class="banner-row">
            <div>
                <div class="headline">Your next 7 days of meals</div>
                <div class="detail">Breakfast, lunch, snack and dinner, rotated automatically and nudged toward higher-carb or higher-protein picks around your hard training days. Click any meal for the full recipe.</div>
            </div>
            <div class="banner-actions">
                <button id="chef-menu-btn" class="btn-secondary">👨‍🍳 The Chef's Menu</button>
                <button id="shopping-list-btn" class="btn-secondary">🛒 Shopping list</button>
            </div>
        </div>
    </div>

    <div id="meal-plan-list"></div>
</div>

<div id="meal-overlay" class="overlay" hidden>
    <div class="detail-modal">
        <button id="meal-close" class="detail-close" aria-label="Close">&times;</button>
        <div id="meal-content"><div class="empty-state">Loading…</div></div>
    </div>
</div>

<div id="shopping-overlay" class="overlay" hidden>
    <div class="detail-modal">
        <button id="shopping-close" class="detail-close" aria-label="Close">&times;</button>
        <div id="shopping-content"><div class="empty-state">Loading…</div></div>
    </div>
</div>

<div id="chef-overlay" class="overlay" hidden>
    <div class="detail-modal">
        <button id="chef-close" class="detail-close" aria-label="Close">&times;</button>
        <div id="chef-content"><div class="empty-state">Loading…</div></div>
    </div>
</div>

<script src="cook.js"></script>
</body>
</html>
